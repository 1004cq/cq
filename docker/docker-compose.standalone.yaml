version: '3.8'

services:
  # ==================== 基础支撑服务 ====================

  mongo:  # MongoDB（cqim 主业务数据库）
    image: mongo:7
    container_name: cqim-mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "${CQIM_MONGO_PORT:-27017}:27017"
    volumes:
      - ./mongodata:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${CQIM_MONGO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.runCommand({ping:1}).ok\" | grep 1"]
      interval: 15s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  mysql:  # mysql 数据库（用于 cqim 审计与日志）
    image: mysql:8.0
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./mysqldata:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=cqim_audit
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  redis:  # redis 缓存与消息订阅
    image: redis:7.2
    restart: always
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ==================== CQIM 核心应用服务 ====================

  cqim:  # CQIM Node.js 全栈应用（Express 后端 + React 前端托管）
    build:
      context: ../cqim-app
      dockerfile: Dockerfile
    image: cqim:latest
    container_name: cqim-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mongodb://root:${CQIM_MONGO_ROOT_PASSWORD}@mongo:27017/cqim?authSource=admin
      - REDIS_URL=redis://redis:6379
      - MYSQL_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/cqim_audit
      - MYSQL_AUDIT_ENABLED=true
    volumes:
      - ./cqim-data:/app/prisma/data
      - ./cqim-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  cqim-gateway:  # CQIM Go 网关（群聊 WebSocket 实时分发）
    build:
      context: ../cqim-app/go-gateway
      dockerfile: Dockerfile
    image: cqim-gateway:latest
    container_name: cqim-gateway
    restart: unless-stopped
    ports:
      - "${CQIM_GATEWAY_PORT:-8081}:8081"
    depends_on:
      cqim:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - GATEWAY_PORT=8081
      - CQIM_API_URL=http://cqim:3000
      - REDIS_ADDR=redis:6379
      - DB_PATH=/app/data/gateway.db
    volumes:
      - ./cqim-gateway-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
