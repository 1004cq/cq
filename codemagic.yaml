workflows:
  ios-adhoc:
    name: iOS Ad Hoc Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.imim.chat
      groups:
        - ios_credentials
    scripts:
      - name: Install Node dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web assets
        script: |
          npm run build
      - name: Add iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.imim.chat" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS app
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - 84294924@qq.com
        notify:
          success: true
          failure: true
