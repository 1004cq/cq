# CQIM 独立部署 Nginx 配置
# 架构: 纯 CQIM 全栈方案 (Express + React + Go Gateway)

# COS 代理缓存（加速媒体拉取）
proxy_cache_path /var/cache/nginx/cqim_cos
                 levels=1:2
                 keys_zone=cqim_cos:32m
                 max_size=10g
                 inactive=14d
                 use_temp_path=off;

# API 限流区
limit_req_zone $binary_remote_addr zone=cqim_api_limit:10m rate=50r/s;

server {
    listen 80;
    server_name wed.imim.chat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name wed.imim.chat;

    # SSL 证书路径（请根据实际情况修改）
    ssl_certificate /etc/nginx/ssl/wed.imim.chat.crt;
    ssl_certificate_key /etc/nginx/ssl/wed.imim.chat.key;
    
    # 安全加固
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    
    client_max_body_size 200M;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 1. CQIM WebSocket (群聊网关)
    location /ws/group {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. CQIM COS 媒体代理缓存
    location ^~ /api/cos/proxy/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache cqim_cos;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_range";
        proxy_cache_valid 200 206 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_buffering on;
    }

    # 3. CQIM API 路由
    location /api/ {
        limit_req zone=cqim_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. CQIM 静态资源强缓存
    location ~* ^/(assets|stickers)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|tgs)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # 5. CQIM 前端主应用 (根路径)
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
